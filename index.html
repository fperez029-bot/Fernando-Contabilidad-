<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Página de Fernando Contabilidad - Asesoría contable y financiera">
    <meta name="keywords" content="Contabilidad, Finanzas, Impuestos, Asesoría, Fernando Contabilidad">
    <meta name="author" content="Fernando">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Fernando Contabilidad | Asesoría Financiera</title>
</head>
<body>

    <header class="headerTechiY">
        <div class="logo">
            <!-- Ruta corregida hacia la carpeta img -->
            <img src="img/logo.jpeg" alt="Logo Fernando Contabilidad" class="logo">
        </div>

        <nav class="nav">
            <ul>
                <li><a href="#inicio" class="nav-button">Inicio</a></li>
                <li><a href="#quienes-somos" class="nav-button">Quiénes Somos</a></li>
                <li><a href="#servicios" class="nav-button">Servicios</a></li>
                <li><a href="#contacto" class="nav-button">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="inicio" class="hero-fundacion">
            <div class="video-background">
                <!-- Ruta corregida hacia la carpeta video -->
                <video autoplay muted loop playsinline width="100%">
                    <source src="video/video.mp4" type="video/mp4">
                    Tu navegador no soporta video en HTML5.
                </video>
            </div>

            <div class="hero-content">
                <h2>Bienvenidos a Fernando Contabilidad</h2>
                <p>Optimiza tus impuestos y toma el control total de tus finanzas con asesoría profesional.</p>

                <div class="hero-buttons">
                    <a href="#servicios" class="btn">Servicios</a>
                    <a href="#contacto" class="btn">Contacto</a>
                </div>
            </div>
        </section>
    </main>

</html>
